<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호보이드 스폰 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=Special+Elite&display=swap">
<style>
/* Layout: one column survival terminal — header strip, wheel, result note, town checklist. Single dark look on purpose (game UI). */
:root{
  --bg:#141413;
  --panel:#1f1e1c;
  --panel-2:#2a2826;
  --line:#3b3835;
  --fg:#e3ddd2;
  --muted:#9b958a;
  --blood:#9e1b16;
  --blood-hi:#c4271f;
  --note:#e8d98a;
  --note-ink:#2b2614;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",system-ui,sans-serif;
  --type:"Special Elite","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(158,27,22,.18), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px);
  color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-inline:16px;padding-block:24px 48px;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

header{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.date{font-family:var(--type);color:var(--muted);font-size:13px;letter-spacing:.06em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,58px);line-height:1.05;margin:0;
  color:var(--fg);text-wrap:balance;text-shadow:3px 3px 0 var(--blood)}
.sub{color:var(--muted);margin:0;max-width:60ch}

.stage{position:relative;display:grid;place-items:center;padding-block:8px}
.wheel-box{position:relative;width:min(100%,460px);aspect-ratio:1;max-width:100%}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--blood-hi);
  filter:drop-shadow(0 3px 0 #000);z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:22%;aspect-ratio:1;border-radius:50%;
  background:var(--panel);border:4px solid var(--line);display:grid;place-items:center;
  font-family:var(--type);font-size:clamp(10px,2.4vw,13px);color:var(--muted);text-align:center;line-height:1.2}

.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;border:0}
.spin{font-family:var(--display);font-size:24px;letter-spacing:.04em;color:#fff;background:var(--blood);
  padding:14px 44px;border-radius:2px;box-shadow:0 4px 0 #4d0c09;transition:transform .08s, background .15s}
.spin:hover{background:var(--blood-hi)}
.spin:active{transform:translateY(3px);box-shadow:0 1px 0 #4d0c09}
.spin:disabled{background:var(--panel-2);color:var(--muted);box-shadow:0 4px 0 #000;cursor:default}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px 16px;border-radius:2px;font-size:14px}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
button:focus-visible,label:focus-within{outline:2px solid var(--note);outline-offset:3px}

.result{background:var(--note);color:var(--note-ink);padding:22px 24px 20px;transform:rotate(-1.2deg);
  box-shadow:0 10px 24px rgba(0,0,0,.5);max-width:520px;width:100%;margin:0 auto;position:relative}
.result::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;transform:translateX(-50%) rotate(2deg);
  background:rgba(220,210,180,.55)}
.result .kicker{font-family:var(--type);font-size:13px;letter-spacing:.05em;margin:0}
.result .town{font-family:var(--display);font-size:clamp(34px,9vw,52px);line-height:1.1;margin:4px 0 2px}
.result .en{font-family:var(--type);font-size:16px;margin:0}
.result .desc{margin:10px 0 0;font-size:14px}
.result .en:empty,.result .desc:empty{display:none}
.result.empty .town{color:rgba(43,38,20,.35)}
.result.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:rotate(-1.2deg) scale(.85)}to{transform:rotate(-1.2deg) scale(1)}}

section.panel{background:var(--panel);border:1px solid var(--line);padding:18px 18px 20px}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.towns{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.town-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;min-width:0}
.town-opt input{accent-color:var(--blood-hi);width:17px;height:17px;flex:none}
.town-opt .sw{width:12px;height:12px;flex:none;border:1px solid rgba(0,0,0,.5)}
.town-opt .nm{font-weight:700;font-size:14px}
.town-opt .tag{font-family:var(--type);font-size:11px;color:var(--note);margin-left:auto;white-space:nowrap}
.town-opt.off{opacity:.45}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.log li{display:flex;gap:12px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.log .n{font-family:var(--type);color:var(--muted);width:3.5em;flex:none}
.log .empty{color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;font-family:var(--type)}

@media (prefers-reduced-motion:reduce){.result.pop{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>호보이드 스폰 룰렛</h1>
    <p class="sub">룰렛이 정한 곳에서 시작합니다. 다시 돌리기 없음.</p>
  </header>

  <div class="stage">
    <div class="wheel-box">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="920" height="920" aria-label="스폰 지역 룰렛"></canvas>
      <div class="hub" id="hub">SPIN<br>TO<br>SPAWN</div>
    </div>
  </div>

  <div class="controls">
    <button class="spin" id="spinBtn">룰렛 돌리기</button>
  </div>

  <div class="result empty" id="result" aria-live="polite">
    <div class="town" id="rTown">???</div>
    <p class="en" id="rEn"></p>
    <p class="desc" id="rDesc"></p>
  </div>

  <section class="panel">
    <h2>룰렛에 넣을 지역</h2>
    <p class="hint">기본 = 어떤 모드에서든 선택 가능 · 샌드박스 = 커스텀 샌드박스에서만 선택 가능. 빼고 싶은 곳은 체크 해제하세요 (최소 2곳).</p>
    <div class="towns" id="towns"></div>
  </section>

  <footer>호보이드 스폰 룰렛 · Project Zomboid 팬 메이드 · 비공식</footer>
</div>

<script>
const TOWNS = [
  // Build 42 vanilla spawn towns: 4 default, 7 Custom Sandbox only (Louisville isn't selectable)
  {ko:"멀드로", en:"Muldraugh", tag:"기본", color:"#5a2a24", desc:"맵 한가운데. 상점이 몰려 있고 길이 단순해서 첫 판에 무난한 곳."},
  {ko:"웨스트 포인트", en:"West Point", tag:"기본", color:"#3d4a3a", desc:"물자는 넉넉한데 시내에 좀비가 바글바글. 시작부터 정신없을 수 있음."},
  {ko:"리버사이드", en:"Riverside", tag:"기본", color:"#4a3f2c", desc:"강가에 있는 조용한 동네. 천천히 자리 잡기 좋음."},
  {ko:"로즈우드", en:"Rosewood", tag:"기본", color:"#2f3d45", desc:"작고 조용한 마을. 경찰서와 소방서가 가까워 초반이 편한 편."},
  {ko:"에코 크릭", en:"Echo Creek", tag:"샌드박스", color:"#4b2f3e", desc:"커스텀 샌드박스에서 고를 수 있는 마을. 낯선 길 찾기부터 시작."},
  {ko:"에크론", en:"Ekron", tag:"샌드박스", color:"#3a3a2a", desc:"커스텀 샌드박스에서 고를 수 있는 시골 마을. 외딴 분위기의 생존."},
  {ko:"폴라스 레이크", en:"Fallas Lake", tag:"샌드박스", color:"#2c3a44", desc:"커스텀 샌드박스에서 고를 수 있는 호숫가 마을. 조용하게 시작하기 좋음."},
  {ko:"마치 릿지", en:"March Ridge", tag:"샌드박스", color:"#4a2a2a", desc:"커스텀 샌드박스 전용. 주택가가 빽빽해서 초보에겐 빡센 편."},
  {ko:"밸리 스테이션", en:"Valley Station", tag:"샌드박스", color:"#33303f", desc:"커스텀 샌드박스 전용. 루이빌 바로 아래쪽의 큰 동네라 좀비도 많음."},
  {ko:"어빙턴", en:"Irvington", tag:"샌드박스", color:"#2e3a33", desc:"커스텀 샌드박스에서 고를 수 있는 꽤 큰 마을. 둘러볼 곳이 많음."},
  {ko:"브랜든버그", en:"Brandenburg", tag:"샌드박스", color:"#433024", desc:"커스텀 샌드박스에서 고를 수 있는 큰 도시. 볼 건 많고 그만큼 위험함."}].map(t => ({...t, on:true}));

const cv = document.getElementById("wheel");
const ctx = cv.getContext("2d");
const spinBtn = document.getElementById("spinBtn");
const resultEl = document.getElementById("result");
const hub = document.getElementById("hub");
let rotation = 0, spinning = false, soundOn = true, audio = null, history = [];

try { const s = JSON.parse(localStorage.getItem("pz-roulette-off") || "[]"); TOWNS.forEach(t => { if (s.includes(t.en)) t.on = false; }); } catch(e) {}

const active = () => TOWNS.filter(t => t.on);

function draw(){
  const list = active(), n = list.length, W = cv.width, c = W/2, r = c - 16;
  ctx.clearRect(0,0,W,W);
  // outer rim
  ctx.beginPath(); ctx.arc(c,c,r+12,0,Math.PI*2); ctx.fillStyle="#0b0b0a"; ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle="#3b3835"; ctx.stroke();
  const seg = Math.PI*2/n;
  list.forEach((t,i) => {
    const a0 = rotation + i*seg - Math.PI/2, a1 = a0 + seg;
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,r,a0,a1); ctx.closePath();
    ctx.fillStyle = t.color; ctx.fill();
    // grime
    const g = ctx.createRadialGradient(c,c,r*.2,c,c,r);
    g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,.35)");
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle="#0b0b0a"; ctx.stroke();
    // label
    ctx.save(); ctx.translate(c,c); ctx.rotate(a0 + seg/2);
    ctx.textAlign="right"; ctx.textBaseline="middle";
    const size = n > 10 ? 34 : n > 6 ? 40 : 48;
    ctx.font = `${size}px "Black Han Sans", "Noto Sans KR", sans-serif`;
    ctx.fillStyle="#000"; ctx.fillText(t.ko, r-34+3, 3);
    ctx.fillStyle="#efe8db"; ctx.fillText(t.ko, r-34, 0);
    ctx.font = `22px "Special Elite", monospace`;
    ctx.fillStyle="rgba(239,232,219,.6)"; ctx.fillText(t.en.toUpperCase(), r-34, size*0.72);
    ctx.restore();
  });
  // pegs
  list.forEach((_,i) => {
    const a = rotation + i*seg - Math.PI/2;
    ctx.beginPath(); ctx.arc(c+Math.cos(a)*(r+4), c+Math.sin(a)*(r+4), 8, 0, Math.PI*2);
    ctx.fillStyle="#c9c1b3"; ctx.fill();
  });
}

function renderTowns(){
  const box = document.getElementById("towns");
  box.innerHTML = "";
  TOWNS.forEach((t,i) => {
    const lab = document.createElement("label");
    lab.className = "town-opt" + (t.on ? "" : " off");
    lab.innerHTML = `<input type="checkbox" id="town-${i}" ${t.on?"checked":""}><span class="sw" style="background:${t.color}"></span><span class="nm">${t.ko}</span><span class="tag">${t.tag}</span>`;
    lab.querySelector("input").addEventListener("change", e => {
      if (!e.target.checked && active().length <= 2) { e.target.checked = true; return; }
      t.on = e.target.checked; lab.classList.toggle("off", !t.on);
      try { localStorage.setItem("pz-roulette-off", JSON.stringify(TOWNS.filter(x=>!x.on).map(x=>x.en))); } catch(err) {}
      draw();
    });
    box.appendChild(lab);
  });
}

function tick(){
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type="square"; o.frequency.value = 900 + Math.random()*200;
    g.gain.setValueAtTime(.06, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+.05);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+.06);
  } catch(e) {}
}
function thud(){
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(160, audio.currentTime); o.frequency.exponentialRampToValueAtTime(40, audio.currentTime+.5);
    g.gain.setValueAtTime(.25, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+.6);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+.6);
  } catch(e) {}
}

function spin(){
  if (spinning) return;
  const list = active(), n = list.length, seg = Math.PI*2/n;
  const winner = Math.floor(Math.random()*n);
  // land the winner's center (with a little jitter) under the top pointer
  const jitter = (Math.random()-.5) * seg * .7;
  const targetMod = ((-(winner*seg + seg/2) + jitter) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  const curMod = ((rotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  let delta = targetMod - curMod; if (delta < 0) delta += Math.PI*2;
  const turns = 6 + Math.floor(Math.random()*3);
  const start = rotation, end = rotation + turns*Math.PI*2 + delta;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = reduce ? 600 : 5200 + Math.random()*1200;
  const t0 = performance.now();
  let lastSeg = Math.floor(start/seg);
  spinning = true; spinBtn.disabled = true; spinBtn.textContent = "돌아가는 중…"; hub.innerHTML = "…";
  resultEl.classList.add("empty"); resultEl.classList.remove("pop");
  document.getElementById("rTown").textContent = "???";
  document.getElementById("rEn").textContent = "";
  document.getElementById("rDesc").textContent = "";
  function frame(now){
    const p = Math.min(1, (now - t0)/dur);
    const e = 1 - Math.pow(1-p, 4);
    rotation = start + (end-start)*e;
    const s = Math.floor(rotation/seg);
    if (s !== lastSeg) { lastSeg = s; tick(); }
    draw();
    if (p < 1) requestAnimationFrame(frame); else done(list[winner]);
  }
  requestAnimationFrame(frame);
}

function done(t){
  spinning = false; spinBtn.disabled = false; spinBtn.textContent = "다시 돌리기"; hub.innerHTML = "DAY<br>1";
  thud();
  document.getElementById("rTown").textContent = t.ko;
  document.getElementById("rEn").textContent = t.en;
  document.getElementById("rDesc").textContent = t.desc;
  resultEl.classList.remove("empty"); void resultEl.offsetWidth; resultEl.classList.add("pop");
}

spinBtn.addEventListener("click", spin);
cv.addEventListener("click", spin);

renderTowns();
draw();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>
</body>
</html>
