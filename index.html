/* Galmuri by Minseo Lee, SIL Open Font License 1.1 */
/* Concept: a tiger arcade cabinet. Marquee, screen, control deck and ticket all live in one cabinet body.
   Palette is taken from the tiger only: ink, maroon cabinet, tiger orange, gold, cream, lever red. Single night look by choice. */
:root {
  --night: #1d1230;
  --ink: #2b1b24;
  --cab: #5a2236;
  --cab-hi: #7a3048;
  --cab-lo: #3d1626;
  --orange: #f2902f;
  --orange-d: #c8621e;
  --gold: #ffc94a;
  --cream: #fff3dc;
  --cream-d: #e8d3b0;
  --red: #e2543b;
  --red-d: #a82c2c;
  --soft: #c99aae;
  --f: "Galmuri", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  --pad: 16px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--night); color: var(--cream); font-family: var(--f);
  font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  -webkit-font-smoothing: none;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 448px; margin: 0 auto; }

/* pixel outline with notched corners */
.notch { box-shadow: -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink); }

.cabinet {
  background: var(--cab); padding: var(--pad); display: grid; gap: var(--pad); justify-items: center;
  box-shadow:
    -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink),
    inset 4px 4px 0 0 var(--cab-hi), inset -4px -4px 0 0 var(--cab-lo),
    0 16px 0 0 rgba(0,0,0,.3);
}

/* marquee with blinking bulbs */
.marquee {
  margin: 0; width: 100%; padding: 14px 12px; background: var(--ink); text-align: center; position: relative;
  font-weight: 700; font-size: clamp(22px, 6.4vw, 30px); line-height: 1.2; color: var(--gold);
  text-shadow: 0 3px 0 var(--orange-d);
}
.marquee::before, .marquee::after {
  content: ""; position: absolute; left: 8px; right: 8px; height: 4px;
  background: repeating-linear-gradient(90deg, var(--gold) 0 4px, transparent 4px 12px);
  animation: bulbs 1.2s steps(1) infinite;
}
.marquee::before { top: 4px; }
.marquee::after { bottom: 4px; animation-delay: -.6s; }
@keyframes bulbs { 50% { background: repeating-linear-gradient(90deg, transparent 0 8px, var(--gold) 8px 12px); } }

.machine { position: relative; width: 100%; container-type: inline-size; }
.machine.thunk { animation: thunk .28s steps(4) 1; }
.machine.hop { animation: hop .6s steps(6) 1; }
@keyframes thunk { 25% { transform: translate(-4px, 2px); } 50% { transform: translate(4px, -2px); } 75% { transform: translate(-2px, 0); } }
@keyframes hop { 30% { transform: translateY(-10px); } 60% { transform: translateY(0); } 80% { transform: translateY(-4px); } }
#tiger { width: 100%; display: block; image-rendering: pixelated; }
/* reel sits over the cream window inside the mouth: x22..82, y57..79 of a 104x100 sprite (head centred at x52) */
.reel {
  position: absolute; left: calc(22 / 104 * 100%); width: calc(60 / 104 * 100%);
  top: calc(57 / 100 * 100%); height: calc(22 / 100 * 100%);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(transparent 0, #000 30%, #000 70%, transparent 100%);
  mask-image: linear-gradient(transparent 0, #000 30%, #000 70%, transparent 100%);
}
.strip { will-change: transform; }
.strip div {
  height: calc(22 / 3 / 104 * 100cqw); display: grid; place-items: center;
  font-weight: 700; font-size: 4.6cqw; color: var(--ink); white-space: nowrap;
}
.lever-hit {
  position: absolute; left: calc(84 / 104 * 100%); width: calc(20 / 104 * 100%);
  top: calc(22 / 100 * 100%); height: calc(50 / 100 * 100%);
  background: none; border: 0; cursor: grab; padding: 0; touch-action: none;
}
.lever-hit:active { cursor: grabbing; }

/* control deck: LED readout + the big red button */
.deck { width: 100%; display: grid; gap: 12px; }
.screen {
  background: var(--ink); min-height: 76px; padding: 12px 16px; display: grid; gap: 2px; place-items: center; align-content: center; position: relative;
  box-shadow: inset 0 4px 0 0 rgba(0,0,0,.35), inset 0 -2px 0 0 var(--cab-hi);
}
.screen .small { font-size: 12px; color: var(--soft); }
.screen .town { font-size: 24px; font-weight: 700; color: var(--gold); min-height: 1.3em; text-shadow: 0 0 8px rgba(255,201,74,.35); }
.screen .town.idle { font-size: 15px; font-weight: 400; color: var(--soft); text-shadow: none; }
.cursor { position: absolute; right: 12px; bottom: 6px; font-size: 12px; color: var(--gold); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.pull {
  font: inherit; font-weight: 700; font-size: 18px; color: var(--cream);
  background: var(--red); border: 0; width: 100%; padding: 14px 16px 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  text-shadow: 0 2px 0 var(--red-d);
  box-shadow:
    -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink),
    inset 0 -6px 0 0 var(--red-d), inset 0 4px 0 0 #f07a62;
}
.pull svg { width: 20px; height: 18px; shape-rendering: crispEdges; flex: none; }
.pull svg g { fill: var(--cream); }
.pull:active:not(:disabled) { transform: translateY(4px); box-shadow: -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), inset 0 -2px 0 0 var(--red-d), inset 0 4px 0 0 #f07a62; }
.pull:disabled { filter: saturate(.3) brightness(.8); cursor: default; }
button:focus-visible, input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 5px; }

/* inset panels on the cabinet */
.group { width: 100%; background: var(--cab-lo); padding: 16px 12px; display: grid; gap: 14px; justify-items: center; box-shadow: inset 0 4px 0 0 rgba(0,0,0,.25); }
.group-head { display: flex; gap: 8px; align-items: baseline; justify-content: center; }
h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--gold); }
.count { font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
.towns { display: flex; flex-wrap: wrap; gap: 10px 8px; justify-content: center; padding: 2px; }

<body>

<script>
const TOWNS = ["멀드로우", "리버사이드", "브란덴부르크", "에코 크릭", "에크론", "팔라스 레이크",
  "어빙턴", "루이스빌", "머치릿지", "로즈 우드", "밸리 스테이션", "웨스트 포인트"];

const $ = id => document.getElementById(id);

/* ---------- 8-bit sound ---------- */
let audio;

/* ---------- pixel sky ---------- */
const sky = $("sky"), sx = sky.getContext("2d");

$("allOn").addEventListener("click", () => { if (spinning) return; off.clear(); save(); renderTowns(); buildStrip(); refresh(); });
$("allOff").addEventListener("click", () => { if (spinning) return; TOWNS.forEach(t => off.add(t)); save(); renderTowns(); buildStrip(); refresh(); });
$("clearLog").addEventListener("click", () => { history = []; save(); renderLog(); });
$("removeWin").checked = store.get("pzt-remove", false);
$("removeWin").addEventListener("change", e => store.set("pzt-remove", e.target.checked));
document.addEventListener("keydown", e => {
  if ((e.code === "Space" || e.code === "Enter") && !e.target.closest("input, button")) { e.preventDefault(); spin(); }
});

drawTiger(); renderTowns(); renderLog(); buildStrip(); fit(); refresh();
document.fonts && document.fonts.ready.then(placeStrip);
</script>
</body>
</html>
